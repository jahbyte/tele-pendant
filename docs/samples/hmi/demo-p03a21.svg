<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="P03A21 welding pendant plant">
  <defs>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c242c"/>
      <stop offset="100%" stop-color="#0d1116"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a969f"/>
      <stop offset="100%" stop-color="#4e5963"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d7a86"/>
      <stop offset="50%" stop-color="#b7c2cb"/>
      <stop offset="100%" stop-color="#6d7a86"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bay)"/>
  <rect x="0" y="292" width="640" height="68" fill="#12171c"/>
  <rect x="24" y="304" width="592" height="10" rx="2" fill="#3a444e"/>

  <!-- Welding cell frame -->
  <rect x="70" y="70" width="14" height="230" fill="url(#frame)"/>
  <rect x="556" y="70" width="14" height="230" fill="url(#frame)"/>
  <rect x="70" y="70" width="500" height="14" rx="2" fill="url(#frame)"/>
  <rect x="90" y="88" width="460" height="200" fill="#151b21" stroke="#2c3640" stroke-width="2"/>

  <!-- Workpiece pipe -->
  <rect x="150" y="200" width="340" height="36" rx="18" fill="url(#pipe)"/>
  <ellipse cx="150" cy="218" rx="12" ry="18" fill="#9aa6b0"/>
  <ellipse cx="490" cy="218" rx="12" ry="18" fill="#5c6772"/>
  <text x="320" y="222" text-anchor="middle" fill="#1a222a" font-family="ui-monospace, monospace" font-size="11">PIPE</text>

  <!-- Seam tracking / laser head -->
  <rect x="300" y="120" width="40" height="58" rx="4" fill="#c5ced6"/>
  <rect x="312" y="178" width="16" height="22" fill="#e0a45a"/>
  <line x1="320" y1="200" x2="320" y2="210" stroke="#f0c56a" stroke-width="3"/>
  <circle cx="320" cy="214" r="4" fill="#f5d78a" opacity="0.9"/>

  <!-- Teach pendant silhouette -->
  <rect x="520" y="140" width="52" height="88" rx="6" fill="#2a333c" stroke="#7a8792" stroke-width="2"/>
  <rect x="528" y="150" width="36" height="28" rx="2" fill="#4a9fd4"/>
  <rect x="528" y="186" width="16" height="12" rx="1" fill="#6b7782"/>
  <rect x="548" y="186" width="16" height="12" rx="1" fill="#6b7782"/>
  <rect x="528" y="204" width="36" height="12" rx="1" fill="#c45c5c"/>
  <text x="546" y="248" text-anchor="middle" fill="#8b97a3" font-family="system-ui, sans-serif" font-size="9">P03A21</text>

  <text x="320" y="48" text-anchor="middle" fill="#a8b4c0" font-family="system-ui, sans-serif" font-size="14" letter-spacing="2">P03A21 WELD CELL</text>
  <text x="40" y="340" fill="#6a7788" font-family="system-ui, sans-serif" font-size="11">Sample plant graphic — Siemens P03A21 pendant demo</text>
</svg>
